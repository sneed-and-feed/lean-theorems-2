version: "v0.4"

project:
  name: "The Lindström–Gessel–Viennot Lemma (LGV Lemma)"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of the Lindström–Gessel–Viennot (LGV) Lemma (Lindström 1973, Gessel & Viennot 1985)
    connecting matrix determinants to sums of non-intersecting path systems in directed graphs. Proves the Leibniz
    determinant expansion over permutation path products, the sign-reversing involution cancellation of intersecting path systems,
    the full LGV determinant identity, and its specialization to planar DAGs. To the maintainers' knowledge, the theorem
    was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision
    (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05A15", "05A19", "15A15"]

sources:
  - title: "On the vector representations of induced matroids"
    type: paper
    authors:
      - "Bernt Lindström"
    year: 1973
    venue: "Bulletin of the London Mathematical Society, 5(1), 85–90"
    relationship: formalizes
  - title: "Binomial determinants, paths, and hook length formulae"
    type: paper
    authors:
      - "Ira Gessel"
      - "Gérard Viennot"
    year: 1985
    venue: "Advances in Mathematics, 58(3), 300–321"
    relationship: formalizes
  - title: "Enumerative Combinatorics, Volume 2"
    type: book
    authors:
      - "Richard P. Stanley"
    year: 1999
    venue: "Cambridge University Press"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/LinearAlgebra/Matrix/Determinant/Basic.lean"
    relationship: builds-on
    note: >-
      Builds on Mathlib's permutation sign and Leibniz matrix determinant formulas to establish
      non-intersecting path counting identities.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with interactive Lean LSP checking
        and verified with zero custom axioms under standard Lean 4 kernel axioms.

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate benchmark holes (`:= sorry`), while all definitions and theorem statements
    are fully specified. Solution verified with 0 errors, 0 sorries, and strictly standard kernel axioms.
