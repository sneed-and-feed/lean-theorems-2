version: "v0.4"

project:
  name: "Vizing's Theorem on Edge Colorings & König's Line Coloring Theorem"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of Vizing's Theorem (1964) and König's Line Coloring Theorem (1916)
    in graph theory. Formalizes proper edge colorings, the chromatic index \chi'(G), partial edge colorings,
    Kempe chains and alternating walks, Vizing fan recoloring operations, and proves that \Delta(G) <= \chi'(G) <= \Delta(G) + 1
    for all finite simple graphs (the Class 1 / Class 2 dichotomy) and \chi'(G) = \Delta(G) for all bipartite graphs.
    Mathlib contains vertex colorings; this formalization provides the complete edge coloring and chromatic index
    theory, verified absent from the core Mathlib library in this verified form (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C15"]

sources:
  - title: "On an estimate of the chromatic class of a p-graph"
    type: paper
    authors:
      - "Vadim G. Vizing"
    year: 1964
    venue: "Diskretny Analiz, 3, 25–30"
    relationship: formalizes
  - title: "Über Graphen und ihre Anwendung auf Determinantentheorie und Mengenlehre"
    type: paper
    authors:
      - "Dénes König"
    year: 1916
    venue: "Mathematische Annalen, 77(4), 453–465"
    relationship: formalizes

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Combinatorics/SimpleGraph/Coloring/Vertex.lean"
    relationship: builds-on
    note: >-
      Builds on Mathlib's simple graph theory and develops the entire proper edge coloring and chromatic index
      framework including Kempe chains, alternating paths, and fan extensions.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with interactive Lean LSP checking
        and verified with zero custom axioms under standard Lean 4 kernel axioms.

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate benchmark holes (`:= sorry`), while all definitions and theorem statements
    are fully specified. Solution verified with 0 errors, 0 sorries, and strictly standard kernel axioms.
