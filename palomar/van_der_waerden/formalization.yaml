version: "v0.4"

project:
  name: "Van der Waerden's Theorem on Arithmetic Progressions"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of the one-dimensional Van der Waerden Theorem on
    Arithmetic Progressions (1927), establishing both the finite version (for every r ≥ 1
    colors and progression length k ≥ 1, there exists a finite bound W such that every
    r-coloring of Fin W contains a monochromatic arithmetic progression of length k) and
    the infinite version (every r-coloring of ℕ contains an arbitrary length-k monochromatic
    arithmetic progression). The finite version is derived via combinatorial lines and
    the Hales–Jewett theorem, and the infinite version via monochromatic homothetic copies.

classification:
  arxiv: [math.CO]
  msc2020: ["05D10", "11B25"]

