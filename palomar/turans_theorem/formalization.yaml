version: "v0.4"

project:
  name: "Turán's Theorem in Extremal Graph Theory"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of Turán's Theorem (1941), Mantel's Theorem (1907), the discrete and
    continuous Turán edge bounds, and the full Turán uniqueness/stability characterization. Proves that any
    K_{r+1}-free simple graph on n vertices has at most the number of edges in the complete r-partite Turán graph T(n, r),
    and that equality holds if and only if G is isomorphic to T(n, r). Mathlib contains the Turán number upper bound;
    this formalization establishes the exact polynomial equivalence between discrete and continuous edge bounds, Mantel's
    theorem, and complete multipartite uniqueness, verified absent from the core Mathlib library in this comprehensive form
    (checked against Mathlib v4.34.0-rc1).

