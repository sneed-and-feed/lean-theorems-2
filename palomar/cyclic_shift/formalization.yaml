version: "v0.4"

project:
  name: "Characteristic Polynomial of Weighted Cyclic Shift Matrices"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization proving the characteristic polynomial of a general weighted cyclic shift
    matrix over an arbitrary commutative ring R. Proves that charpoly(shiftMatrix n W) = X^n for nilpotent
    subdiagonal shift matrices, det(upperBidiagonal n W) = \prod (-C(W i)), and establishes that for any
    L-dimensional cyclic matrix with weights W, charpoly(cyclicWeightMatrix W) = X^L - C(\prod W).
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring,
    and type signature search of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.RA, math.CO]
  msc2020: ["15A15", "15A18", "15B05"]

