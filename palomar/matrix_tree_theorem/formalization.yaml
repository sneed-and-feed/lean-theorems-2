version: "v0.4"

project:
  name: "Algebraic Foundations of the Matrix-Tree Theorem and Graph Laplacians"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of the algebraic and spectral foundations of Kirchhoff's Matrix-Tree
    Theorem and spectral graph theory. Proves the symmetry of the combinatorial graph Laplacian L^T = L,
    the zero row-sum null-vector property \sum_v L_{u,v} = 0, and the fundamental signed incidence matrix
    factorization L = B B^T for arbitrary edge orientations. Mathlib contains definitions of simple graph
    adjacency matrices and degrees; this formalization constructs the full combinatorial Laplacian operator
    and signed incidence factorization, verified absent from the core Mathlib library in this verified form
    (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.SP]
  msc2020: ["05C50", "15A15", "05C05"]

sources:
  - title: "Über die Auflösung der Gleichungen, auf welche man bei der Untersuchung der linearen Vertheilung galvanischer Ströme geführt wird"
    type: paper
    authors:
      - "Gustav Kirchhoff"
    year: 1847
    venue: "Annalen der Physik und Chemie, 148(12), 497–508"
    relationship: formalizes
  - title: "Enumerative Combinatorics, Volume 1"
    type: book
    authors:
      - "Richard P. Stanley"
    year: 2012
    venue: "Cambridge University Press"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/Combinatorics/SimpleGraph/AdjMatrix.lean"
    relationship: builds-on
    note: >-
      Builds on Mathlib's simple graph adjacency matrix and degree definitions to construct combinatorial
      Laplacians and prove the signed incidence matrix factorization L = B B^T.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with interactive Lean LSP checking
        and verified with zero custom axioms under standard Lean 4 kernel axioms.

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate benchmark holes (`:= sorry`), while all definitions and theorem statements
    are fully specified. Solution verified with 0 errors, 0 sorries, and strictly standard kernel axioms.
