version: "v0.4"

project:
  name: "Brooks' Theorem on Graph Colorings and Lovász Orderings"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of Brooks' Theorem on vertex colorings (1941), formalizing the small-graph
    extremal characterization (non-complete graphs with |V| <= Delta + 1 are Delta-colorable), the odd-cycle parity
    obstruction (odd cycles are not 2-colorable), and the constructive Lovász Ordering coloring reduction (1975).
    Mathlib contains basic simple graph coloring definitions; this formalization provides a self-contained maximum
    degree colorability theory and formalizes the exact greedy ordering and extremal cases, verified absent from the core
    Mathlib library in this verified form (checked against Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C15"]

sources:
  - title: "On colouring the nodes of a network"
    type: paper
    authors:
      - "R. L. Brooks"
    year: 1941
    venue: "Mathematical Proceedings of the Cambridge Philosophical Society, 37(2), 194–197"
    relationship: formalizes
  - title: "Three short proofs in graph theory"
    type: paper
    authors:
      - "László Lovász"
    year: 1975
    venue: "Journal of Combinatorial Theory, Series B, 19(3), 269–271"
    relationship: adapts
    note: >-
      Formalization adapts Lovász's ordering and cycle-avoiding coloring reduction to establish Brooks' vertex
      coloring bound chi(G) <= Delta(G).

related_formalizations: []

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with interactive Lean LSP checking
        and verified with zero custom axioms under standard Lean 4 kernel axioms.

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate benchmark holes (`:= sorry`), while all definitions and theorem statements
    are fully specified. Solution verified with 0 errors, 0 sorries, and strictly standard kernel axioms.
