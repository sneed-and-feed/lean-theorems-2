version: "v0.4"

project:
  name: "Ramanujan Tau Function and Congruence Modulo 691"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    Lean 4 formalization of the Ramanujan tau function \tau(n) and the exact Bernoulli number computation
    B_{12} = -691/2730. The formalization establishes the linear algebraic congruence modulo 691 reduction
    \tau(n) \equiv \sigma_{11}(n) \pmod{691} assuming the 2-dimensional modular forms span of M_{12}
    (M_12_is_span) and existence of the weight-12 Eisenstein modular form E_{12} / integer eigenform F
    (F_exists) as explicit premises, in accordance with AP-01/AP-07/AP-28 disclosure standards.

classification:
  arxiv: [math.NT]
  msc2020: ["11F11", "11F33", "11B68"]

sources:
  - title: "On certain arithmetical functions"
    type: paper
    authors:
      - "Srinivasa Ramanujan"
    year: 1916
    venue: "Transactions of the Cambridge Philosophical Society, 22(9), 159–184"
    relationship: formalizes
  - title: "A Course in Arithmetic"
    type: book
    authors:
      - "Jean-Pierre Serre"
    year: 1973
    venue: "Graduate Texts in Mathematics, 7, Springer"
    relationship: adapts
    note: >-
      Formalization adapts Serre's weight-12 modular forms reduction modulo 691, isolating the dimension-two
      modular forms span M_{12} = span(E_{12}, Delta) and existence of E_{12} as explicit premises.

related_formalizations: []

automation:
