version: "v0.4"

project:
  name: "The Ihara–Bass Determinantal Formula for Graphs"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of the Ihara–Bass Determinantal Formula (Bass 1992, Ihara 1966)
    connecting the Hashimoto edge-adjacency operator determinant with the vertex Laplacian-type determinant
    via block matrix Schur complement factorizations. Proves the exact matrix block factorizations M N = K,
    K L = KL, and deduces the Ihara–Bass polynomial identity. To the maintainers' knowledge, the theorem
    was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision
    (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO]
  msc2020: ["05C50", "11M36", "15A15"]

sources:
  - title: "The Ihara-Selberg zeta function of a tree lattice"
    type: paper
    authors:
      - "Hyman Bass"
    year: 1992
    venue: "International Journal of Mathematics, 3(6), 717–797"
    relationship: formalizes
  - title: "On discrete subgroups of the two by two projective linear group over p-adic fields"
    type: paper
    authors:
      - "Yasutaka Ihara"
    year: 1966
    venue: "Journal of the Mathematical Society of Japan, 18(3), 219–235"
    relationship: background

related_formalizations: []

    relationship: builds-on
    note: >-
      Builds on Mathlib's Schur complement determinant identities for 2x2 block matrices and applies
      them to Hashimoto edge adjacency operators and vertex Laplacians.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with interactive Lean LSP checking
        and verified with zero custom axioms under standard Lean 4 kernel axioms.

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate benchmark holes (`:= sorry`), while all definitions and theorem statements
    are fully specified. Solution verified with 0 errors, 0 sorries, and strictly standard kernel axioms.
