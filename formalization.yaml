version: "v0.4"

project:
  name: "Ramanujan Tau Function and Congruence Modulo 691"
  authors:
    - "Sneed & Feed Formalization Team"
  responsible_maintainers:
    - "sneed-and-feed"
  license: "CC0-1.0"
  description: >-
    A complete Lean 4 formalization of the Ramanujan tau function \tau(n), the exact Bernoulli number computation
    B_{12} = -691/2730, and the Ramanujan congruence \tau(n) \equiv \sigma_{11}(n) \pmod{691} derived from the
    structure of weight-12 modular forms spanned by E_{12} and \Delta. To the maintainers' knowledge, the theorem
    was not found in an exact declaration name, docstring, and type signature search of the pinned Mathlib revision
    (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.NT]
  msc2020: ["11F11", "11F33", "11B68"]

sources:
  - title: "On certain arithmetical functions"
    type: paper
    authors:
      - "Srinivasa Ramanujan"
    year: 1916
    venue: "Transactions of the Cambridge Philosophical Society, 22(9), 159–184"
    relationship: formalizes
  - title: "A Course in Arithmetic"
    type: book
    authors:
      - "Jean-Pierre Serre"
    year: 1973
    venue: "Graduate Texts in Mathematics, 7, Springer"
    relationship: background

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/master/Mathlib/NumberTheory/Bernoulli.lean"
    relationship: builds-on
    note: >-
      Builds on Mathlib's Bernoulli number library and develops formal power series expansions
      for modular forms and Ramanujan congruences.

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow with interactive Lean LSP checking
        and verified with zero custom axioms under standard Lean 4 kernel axioms.

review:
  status: self-assessed
  reviewers:
    - "sneed-and-feed maintainers"
  notes: >-
    Challenge contains deliberate benchmark holes (`:= sorry`), while all definitions and theorem statements
    are fully specified. Solution verified with 0 errors, 0 sorries, and strictly standard kernel axioms.
