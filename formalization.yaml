version: "v0.4"

project:
  name: "The Hoffman–Singleton Moore Graph Classification Theorem"
  authors:
    - "Noah Cohen"
  responsible_maintainers:
    - "Noah Cohen"
  license: "CC0-1.0"
  description: >-
    A complete machine-checked Lean 4 formalization of the Hoffman–Singleton Theorem (1960) on authentic SimpleGraph carriers.
    Establishes the metric-to-strongly-regular bridge proving that any d-regular graph G of diameter 2 and girth 5 is strongly
    regular with parameters (1 + d², d, 0, 1) and satisfies the adjacency matrix equation A² + A - (d - 1)I = J.
    Deduces the spectral decomposition, trace nullity, and multiplicities on EuclideanSpace ℝ V, and proves the complete
    degree classification theorem: any regular graph of degree d ≥ 2 with diameter 2 and girth 5 must have d ∈ {2, 3, 7, 57}.
    To the maintainers' knowledge, the theorem was not found in an exact declaration name, docstring, and type signature search
    of the pinned Mathlib revision (Mathlib v4.34.0-rc1).

classification:
  arxiv: [math.CO, math.SP]
  msc2020: ["05C50", "05C75", "05E30"]

sources:
  - title: "On Moore graphs with diameters 2 and 3"
    type: paper
    authors:
      - "Alan J. Hoffman"
      - "Robert R. Singleton"
    relationship: formalizes

related_formalizations: []

automation:
  methods:
    - method: agent
      tool_setup: >-
        Formalized using an agentic Lean 4 workflow powered by Google DeepMind Gemini models (Gemini Flash
        agent pipeline via the Antigravity system) paired with Lean LSP MCP interactive tooling for proof
        tactic exploration, AST comparison, and verification under maintainer direction and human oversight.
        All declarations rely strictly on standard Lean 4 kernel axioms (propext, Quot.sound, Classical.choice).

review:
  status: self-assessed
  reviewers:
    - "Noah Cohen"
  notes: >-
    Challenge contains deliberate proof holes (`:= sorry` for automated benchmark evaluation),
    while all definitions and theorem statements are completely specified. Solution verified through
    human audit by the maintainers with 0 errors, 0 sorries, and strictly standard kernel axioms.
